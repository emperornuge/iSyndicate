# Fly.io deploy target for the game API (~$5/mo shared VM + volume).
# After `fly launch`, create the volume once:
#   fly volumes create isyndicate_data --size 1 --region iad
app = "isyndicate-api"
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[[mounts]]
  source = "isyndicate_data"
  destination = "/data"
